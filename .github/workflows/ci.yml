# GitHub Actions CI —— 每个 push/PR 自动跑测试
# 注意：不安装 [rag] extra（sentence-transformers/torch 太重），
# RAG 相关测试在无该依赖的环境会自动跳过（见 tests/test_rag.py）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests
        run: pytest

      - name: Verify CLI doctor
        run: python -m jobpilot.cli doctor || true